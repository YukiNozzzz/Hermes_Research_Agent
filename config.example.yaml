# Merge into EACH registered profile's config.yaml. Use the server's absolute data_root.
# Linux example below; Windows local example: E:/harness/research-data.
# Normally the administrator user-add command writes these settings automatically.
# CRA shared context is configured separately by shared-bind; see ALIGNMENT.md.
# Never put database credentials in model-facing plugin settings.
plugins:
  enabled:
    - research-ideation
  entries:
    research-ideation:
      settings:
        data_root: /srv/research-data

# Restricted research profile: no unrestricted terminal/files/code/plugin management.
platform_toolsets:
  cli:
    - research_ideation
    - skills
  default:
    - research_ideation
    - skills

memory:
  memory_enabled: false
  user_profile_enabled: false

auxiliary:
  background_review:
    enabled: false

timezone: Asia/Shanghai
