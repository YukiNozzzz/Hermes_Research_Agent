# Merge into the selected personal Hermes profile. Use the server's absolute data_root.
# Linux example below; Windows local example: E:/harness/research-data.
# Normally the setup command writes these settings automatically.
# CRA shared context is configured separately by shared-bind; see ALIGNMENT.md.
# Never put database credentials in model-facing plugin settings.
plugins:
  enabled:
    - research-ideation
  entries:
    research-ideation:
      settings:
        data_root: /srv/research-data

# Single personal user: native interactive tools plus research and skills.
# A separate background profile is optional, for reusing an existing collector.
platform_toolsets:
  cli:
    - hermes-cli
    - research_ideation
    - skills
  default:
    - hermes-cli
    - research_ideation
    - skills

agent:
  disabled_toolsets: []

memory:
  memory_enabled: true
  user_profile_enabled: true

auxiliary:
  background_review:
    enabled: false

timezone: Asia/Shanghai
